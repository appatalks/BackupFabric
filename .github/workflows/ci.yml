name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Install rsync for synthetic transfer tests
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/backupfabric ./cmd/backupfabric-mock
